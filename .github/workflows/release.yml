name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: win-theme-auto

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage exe
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" "dist/WinThemeAuto-${{ matrix.arch }}.exe"
          $exe = "dist/WinThemeAuto-${{ matrix.arch }}.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WinThemeAuto-${{ matrix.arch }}.exe" | Out-File "$exe.sha256" -Encoding ascii -NoNewline
          Get-ChildItem dist | Format-Table Name, Length
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download exes
        uses: actions/download-artifact@v4
        with:
          pattern: exe-*
          merge-multiple: true
          path: dist

      - name: List files
        run: ls -l dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
